<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- 🔥 ANTI-CACHÉ AGRESIVO: Obliga al navegador del cliente a descargar la versión nueva -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOUR BRIDGE HOME | Tu puente al mundo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- 🔥 CACHE-BUSTING en la librería de Supabase -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?cb=20261124"></script>
<style>
:root{--bg:#0f172a;--panel:#17243a;--panel2:#1d2c44;--gold:#e8b84d;--gold2:#ffd978;--white:#f8fafc;--muted:#aab6c8;--line:#33445f;--green:#25d366;--red:#ef6464;--orange:#ff6b35}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--white);font-family:Montserrat,Arial,sans-serif;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,calc(100% - 32px));margin:auto}
.top-banner{background:linear-gradient(90deg,#1a2941,#142238);border-bottom:1px solid var(--line);overflow:hidden}
.banner-carousel{display:flex;animation:slideBanner 20s infinite}
.banner-item{min-width:100%;text-align:center;padding:10px 0;font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
@keyframes slideBanner{0%,33%{transform:translateX(0)}36%,66%{transform:translateX(-100%)}69%,100%{transform:translateX(-200%)}}
.flash-banner{background:linear-gradient(135deg,#ff6b35,#ff8c42);padding:12px 0;text-align:center;display:none}
.flash-banner.active{display:block}
.flash-content{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.flash-title{font-size:16px;font-weight:900;color:white;text-transform:uppercase}
.flash-countdown{display:flex;gap:10px}
.flash-time{background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:8px;color:white;font-weight:900;font-size:18px;min-width:50px}
.flash-time span{display:block;font-size:9px;font-weight:600;opacity:0.8}
.world-clock-banner{background:#0b1425;border-bottom:1px solid var(--line);padding:8px 0;overflow:hidden}
.ticker-wrap{width:100%;overflow:hidden;white-space:nowrap}
.ticker{display:inline-block;animation:ticker 35s linear infinite}
.ticker-item{display:inline-block;padding:0 25px;font-size:12px;font-weight:700;color:var(--white)}
.ticker-item span{color:var(--gold);font-family:'Courier New',monospace;margin-left:6px}
@keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
header{position:sticky;top:0;z-index:50;background:#0b1425ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.nav{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-weight:900;letter-spacing:1px;color:var(--gold);font-size:19px;white-space:nowrap}
.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:2px}
.navlinks{display:flex;align-items:center;gap:20px}
.navlinks a{font-size:12px;font-weight:700;color:#e5eaf2}
.navlinks a:hover{color:var(--gold)}
.nav-actions{display:flex;align-items:center;gap:8px}
.clock-widget{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:11px;font-weight:700;color:var(--gold);display:flex;flex-direction:column;gap:2px;min-width:130px}
.clock-widget .clock-label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.clock-widget .clock-time{font-size:13px;font-weight:900;font-family:'Courier New',monospace}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;cursor:pointer}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#182235}
.btn-dark{background:#253650;color:white;border:1px solid var(--line)}
.btn-green{background:var(--green);color:#082515}
.btn-red{background:var(--red);color:white}
.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.menu-btn{display:none;background:none;border:0;color:white;font-size:23px}
.lang-select{background:#253650;color:white;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}
.hero{padding:76px 0 55px;background:radial-gradient(ellipse at 80% 10%,#b7892924,transparent 40%),linear-gradient(140deg,#101a2d,#14243a)}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:center}
.eyebrow{color:var(--gold);font-weight:800;font-size:11px;letter-spacing:3px;text-transform:uppercase}
h1{font-size:clamp(34px,5vw,58px);line-height:1.12;margin:14px 0}
h1 span{color:var(--gold)}
.hero p{color:#c0cada;max-width:650px;font-size:15px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero-card,.card{background:linear-gradient(145deg,#1a2941,#142238);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 35px #0002;min-width:0;overflow:hidden}
.hero-card{border-color:#8f713c66}
.hero-card h3{color:var(--gold);margin-top:0}
.hero-card .big{font-size:28px;font-weight:900;overflow-wrap:anywhere}
.hero-card p{font-size:12px;overflow-wrap:anywhere}
section{padding:58px 0}
.section-head{text-align:center;margin-bottom:30px}
.section-head h2{font-size:clamp(24px,4vw,34px);margin:5px 0 8px}
.section-head p{color:var(--muted);font-size:13px}
.gold{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.service-icon{width:48px;height:48px;border-radius:14px;background:#e8b84d1c;color:var(--gold);display:grid;place-items:center;font-size:21px}
.card h3{margin:14px 0 7px;overflow-wrap:anywhere}
.card p{color:var(--muted);font-size:13px;margin:5px 0;overflow-wrap:anywhere}
.price{font-size:25px;font-weight:900;color:var(--gold);margin:12px 0}
.mini{font-size:11px;color:var(--muted)}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#e8b84d1b;color:var(--gold);font-size:10px;font-weight:800}
.rates{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.rate{padding:17px 10px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.rate strong{display:block;font-size:22px;color:var(--gold);overflow-wrap:anywhere}
.rate span{font-size:11px;color:var(--muted)}
.calculator{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.field{min-width:0}
.field label{display:block;font-size:11px;color:#d5deeb;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;min-width:0;background:#0d192b;color:white;border:1px solid #40516a;border-radius:9px;padding:11px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:85px;resize:vertical}
.result{background:#0d192b;border:1px solid var(--gold);border-radius:10px;padding:12px;color:var(--gold);font-weight:900;min-height:44px}
.offer-card{position:relative}
.offer-card .price{margin:8px 0}
.offer-card img{width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:12px;background:#0b1425}
.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.contact-box{overflow:hidden;min-width:0;overflow-wrap:anywhere}
.contact-box a{overflow-wrap:anywhere;max-width:100%}
.contact-box .btn{white-space:normal;text-align:center;max-width:100%}
.official-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.official-link{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;transition:.2s;text-decoration:none}
.official-link:hover{transform:translateY(-3px);border-color:var(--gold);background:var(--panel2)}
.official-link i{font-size:24px;color:var(--gold);flex-shrink:0}
.official-link strong{display:block;color:var(--white);font-size:13px;margin-bottom:3px}
.official-link small{color:var(--muted);font-size:10px}
.weather-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.weather-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;transition:.2s}
.weather-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.weather-card .city-flag{font-size:28px;margin-bottom:5px}
.weather-card .city-name{font-size:13px;font-weight:800;color:var(--white);margin-bottom:8px}
.weather-card .weather-icon{font-size:32px;color:var(--gold);margin:8px 0}
.weather-card .temp{font-size:26px;font-weight:900;color:var(--gold2)}
.weather-card .desc{font-size:11px;color:var(--muted);margin-top:5px;text-transform:capitalize}
.equipaje-selector{background:var(--panel);padding:20px;border-radius:14px;margin-bottom:20px}
.equipaje-result{background:var(--panel2);padding:20px;border-radius:14px;border:1px solid var(--gold)}
.equipaje-result h4{color:var(--gold);margin-top:0}
.equipaje-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:15px}
.equipaje-item{background:var(--bg);padding:15px;border-radius:10px}
.equipaje-item strong{color:var(--gold);display:block;margin-bottom:5px}
.guia-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:15px;cursor:pointer;transition:.2s}
.guia-card:hover{border-color:var(--gold)}
.guia-card h3{color:var(--gold);margin:0 0 10px 0;display:flex;align-items:center;gap:10px}
.guia-content{display:none;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.guia-card.active .guia-content{display:block}
.rastreador-form{background:var(--panel);padding:25px;border-radius:14px;max-width:500px;margin:0 auto}
.rastreador-result{background:var(--panel2);padding:20px;border-radius:14px;margin-top:20px;border-left:4px solid var(--gold)}
.estado-badge{display:inline-block;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;margin-top:10px}
.estado-pendiente{background:#ff9800;color:white}
.estado-proceso{background:#2196f3;color:white}
.estado-completado{background:var(--green);color:white}
.notas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.nota-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s}
.nota-card:hover{transform:translateY(-5px);border-color:var(--gold)}
.nota-card img{width:100%;height:200px;object-fit:cover}
.nota-content{padding:20px}
.nota-card h3{color:var(--gold);margin:0 0 10px 0}
.nota-card .nota-date{font-size:11px;color:var(--muted);margin-bottom:10px}
.nota-destacada{border:2px solid var(--gold)}
.nota-destacada::before{content:'⭐ DESTACADA';display:block;background:var(--gold);color:#182235;padding:5px;text-align:center;font-size:10px;font-weight:900}
.servicio-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:15px}
.galeria-item{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#0b1425;cursor:pointer;transition:.2s}
.galeria-item:hover{transform:scale(1.03);border-color:var(--gold)}
.galeria-item img{width:100%;height:100%;object-fit:cover}
.galeria-item.pdf-item{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:15px;text-align:center}
.galeria-item.pdf-item i{font-size:32px;color:var(--gold)}
.galeria-item.pdf-item small{font-size:9px;color:var(--muted);line-height:1.2}
.galeria-item .tipo-badge{position:absolute;top:6px;right:6px;background:var(--gold);color:#182235;font-size:9px;font-weight:800;padding:3px 7px;border-radius:10px}
.lightbox{display:none;position:fixed;inset:0;background:#000000e6;z-index:200;align-items:center;justify-content:center;padding:20px}
.lightbox.show{display:flex}
.lightbox-content{max-width:90vw;max-height:90vh;position:relative}
.lightbox-content img{max-width:100%;max-height:85vh;border-radius:12px;border:2px solid var(--gold)}
.lightbox-content iframe{width:85vw;height:85vh;border-radius:12px;border:2px solid var(--gold);background:white}
.lightbox-close{position:absolute;top:-15px;right:-15px;background:var(--red);color:white;border:0;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:var(--gold);color:#182235;border:0;width:45px;height:45px;border-radius:50%;font-size:18px;cursor:pointer}
.lightbox-prev{left:-25px}
.lightbox-next{right:-25px}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:12px}
.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.floating{position:fixed;right:16px;bottom:16px;z-index:60;background:var(--green);color:#082515;border-radius:50px;padding:13px 18px;font-size:12px;font-weight:900;box-shadow:0 8px 25px #0005;max-width:calc(100% - 32px);box-sizing:border-box}
.overlay{display:none;position:fixed;inset:0;background:#020817d9;z-index:100;align-items:center;justify-content:center;padding:14px}
.overlay.show{display:flex}
.modal{width:min(900px,100%);max-height:92vh;overflow:auto;background:#142238;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 70px #0009}
.modal h2{margin-top:0;color:var(--gold)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.close{background:#2b3c55;color:white;border:0;border-radius:8px;padding:8px 12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.form-grid .full{grid-column:1/-1}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.admin-tabs button{background:#263852;color:white;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:11px;font-weight:800;cursor:pointer}
.admin-tabs button.active{background:var(--gold);color:#172238}
.admin-panel{display:none}
.admin-panel.active{display:block}
.admin-list{display:grid;gap:9px;margin-top:15px}
.admin-item{padding:12px;background:#0e1b2e;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.admin-item small{color:var(--muted)}
.admin-item button{margin:2px}
.diagnostic{background:#0d192b;border:1px solid var(--line);border-radius:12px;padding:15px;margin:12px 0;font-size:12px;max-height:300px;overflow:auto}
.diagnostic h4{color:var(--gold);margin:0 0 10px 0;font-size:13px}
.diag-line{padding:6px 10px;margin:4px 0;border-radius:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.diag-ok{background:#0f3d1f;color:#a8f0c0}
.diag-err{background:#3d0f0f;color:#f0a8a8}
.diag-info{background:#1a2744;color:#c0d0eb}
.diag-line i{font-size:14px}
.archivo-item-admin{display:flex;align-items:center;gap:10px;padding:8px;background:#1a2744;border-radius:8px;margin-top:6px}
.archivo-item-admin img{width:50px;height:50px;object-fit:cover;border-radius:6px}
.archivo-item-admin i{font-size:24px;color:var(--gold)}
.archivo-item-admin .archivo-info{flex:1;min-width:0}
.archivo-item-admin .archivo-info small{display:block;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-box{background:#1a2744;padding:15px;border-radius:10px;margin-top:12px;border:1px dashed var(--line)}
.upload-box h
