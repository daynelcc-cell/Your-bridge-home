<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Your Bridge Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg: #06111f;
            --card: #10243c;
            --gold: #f5c542;
            --white: #ffffff;
            --muted: #aebdce;
            --green: #25d366;
            --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--bg); color: var(--white); padding: 20px; }

        /* LOGIN SCREEN */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .login-box {
            background: var(--card);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--gold);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .login-box i { font-size: 50px; color: var(--gold); margin-bottom: 20px; }
        .login-box h2 { margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334;
            background: #0d1d31;
            color: white;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: center;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: var(--gold);
            color: var(--bg);
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-box button:hover { background: #ffdf70; }

        /* DASHBOARD */
        #dashboard-screen { display: none; max-width: 1200px; margin: auto; }
        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334;
            padding-bottom: 20px;
        }
        .header-admin h1 { color: var(--gold); }
        .btn-logout {
            background: var(--red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .table-container {
            background: var(--card);
            border-radius: 15px;
            overflow-x: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        th { background: rgba(0,0,0,0.2); color: var(--gold); font-weight: 800; }
        tr:hover { background: rgba(255,255,255,0.02); }
        
        .badge-estado {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .estado-pendiente { background: rgba(245,197,66,0.2); color: var(--gold); }
        .estado-completado { background: rgba(37,211,102,0.2); color: var(--green); }
        
        .acciones button {
            background: transparent;
            border: 1px solid var(--muted);
            color: var(--white);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
            transition: 0.3s;
        }
        .acciones button:hover { background: var(--muted); color: var(--bg); }
        .acciones .btn-delete { border-color: var(--red); color: var(--red); }
        .acciones .btn-delete:hover { background: var(--red); color: white; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <i class="fa-solid fa-lock"></i>
            <h2>Acceso Restringido</h2>
            <input type="password" id="password-input" placeholder="Ingresa la clave">
            <button onclick="verificarClave()">Entrar al Panel</button>
            <p id="error-msg" style="color:var(--red); margin-top:10px; display:none; font-size:12px;">Clave incorrecta</p>
        </div>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN -->
    <div id="dashboard-screen">
        <div class="header-admin">
            <h1><i class="fa-solid fa-chart-line"></i> Solicitudes Recibidas</h1>
            <button class="btn-logout" onclick="cerrarSesion()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Teléfono</th>
                        <th>Servicio</th>
                        <th>Detalles</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-solicitudes">
                    <!-- Los datos se cargarán aquí con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        const CLAVE_SECRETA = "MI_CLAVE_SECRETA"; // 🔐 CAMBIA ESTO POR TU CONTRASEÑA SEGURA
        
        // Supabase (Usa las mismas que en tu index.html)
        const supabaseUrl = 'AQUI_VA_TU_URL_DE_SUPABASE'; 
        const supabaseKey = 'sb_publishable_Y5Cv-rNlmWgSm8gr4F5nAg_0SKI6OfV'; 
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // --- LÓGICA DE LOGIN ---
        function verificarClave() {
            const input = document.getElementById('password-input').value;
            if (input === CLAVE_SECRETA) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'block';
                cargarSolicitudes(); // Cargar datos al entrar
                // Guardar sesión en el navegador para no pedir clave a cada rato
                sessionStorage.setItem('adminLogueado', 'true');
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function cerrarSesion() {
            sessionStorage.removeItem('adminLogueado');
            location.reload();
        }

        // Mantener sesión iniciada si se recarga la página
        if (sessionStorage.getItem('adminLogueado') === 'true') {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';
            cargarSolicitudes();
        }

        // --- CARGAR DATOS DE SUPABASE ---
        async function cargarSolicitudes() {
            const tbody = document.getElementById('tabla-solicitudes');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Cargando datos...</td></tr>';

            // Traer todas las solicitudes ordenadas por fecha (la más nueva primero)
            const { data, error } = await supabase
                .from('solicitudes')
                .select('*')
                .order('fecha_creacion', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--red);">Error: ${error.message}</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay solicitudes aún.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(sol => {
                // Formatear fecha
                const fecha = new Date(sol.fecha_creacion).toLocaleDateString('es-ES', { 
                    day: '2-digit', month: 'short', hour: '2-digit', minute:'2-digit' 
                });

                const estadoClass = sol.estado === 'Completado' ? 'estado-completado' : 'estado-pendiente';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${fecha}</td>
                    <td><strong>${sol.nombre_cliente || 'N/A'}</strong></td>
                    <td>${sol.telefono || 'N/A'}</td>
                    <td><span style="color:var(--gold)">${sol.tipo_servicio || 'N/A'}</span></td>
                    <td>${sol.detalles || 'N/A'}</td>
                    <td><span class="badge-estado ${estadoClass}">${sol.estado || 'Pendiente'}</span></td>
                    <td class="acciones">
                        ${sol.estado !== 'Completado' ? `<button onclick="marcarCompletado(${sol.id})"><i class="fa-solid fa-check"></i></button>` : ''}
                        <button class="btn-delete" onclick="borrarSolicitud(${sol.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- ACCIONES (Actualizar / Borrar) ---
        async function marcarCompletado(id) {
            if(!confirm('¿Marcar esta solicitud como Completada?')) return;

            const { error } = await supabase
                .from('solicitudes')
                .update({ estado: 'Completado' })
                .eq('id', id);

            if (error) alert('Error al actualizar: ' + error.message);
            else cargarSolicitudes(); // Recargar tabla
        }

        async function borrarSolicitud(id) {
            if(!confirm('¿Estás seguro de eliminar esta solicitud permanentemente?')) return;

            const { error } = await supabase
                .from('solicitudes')
                .delete()
                .eq('id', id);

            if (error) alert('Error al borrar: ' + error.message);
            else cargarSolicitudes(); // Recargar tabla
        }
    </script>
</body>
</html>
