<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Bridge Home | Viajes, Remesas y Recargas</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050b18;
      --bg-navy: #0a162e;
      --card-bg: rgba(12, 24, 48, 0.85);
      --card-border: rgba(212, 175, 55, 0.45);
      --gold-light: #fce38a;
      --gold-main: #d4af37;
      --gold-dark: #997315;
      --text-white: #ffffff;
      --text-muted: #cbd5e1;
      --whatsapp: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(212, 175, 55, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 85% 40%, rgba(14, 58, 125, 0.35) 0%, transparent 50%),
        linear-gradient(180deg, #040914 0%, #09152b 50%, #040914 100%);
      color: var(--text-white);
      line-height: 1.5;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Tipografía Dorada Metálica */
    .gold-gradient-text {
      background: linear-gradient(180deg, #fff3b0 0%, #e5b842 50%, #b38016 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
    }

    /* Navegación */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5, 11, 24, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      flex-wrap: wrap;
      gap: 15px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-mini svg {
      width: 34px;
      height: 34px;
    }

    .brand-mini-text {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-mini-sub {
      display: block;
      font-size: 0.68rem;
      color: var(--gold-light);
      font-weight: 500;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a, nav button {
      color: var(--text-white);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav a:hover, nav button:hover {
      color: var(--gold-light);
    }

    .btn-contact-nav {
      background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
      color: #050b18 !important;
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 700 !important;
    }

    /* BANNER PRINCIPAL ESTILO CARTEL PROMOCIONAL */
    .poster-hero {
      position: relative;
      padding: 45px 0 35px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      background: 
        radial-gradient(ellipse at 50% 35%, rgba(252, 227, 138, 0.14) 0%, rgba(10, 22, 46, 0.6) 60%, transparent 100%);
    }

    .poster-frame {
      background: linear-gradient(160deg, rgba(10, 23, 48, 0.94) 0%, rgba(5, 11, 24, 0.98) 100%);
      border: 2px solid var(--gold-main);
      border-radius: 22px;
      padding: 36px 28px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), inset 0 0 35px rgba(212, 175, 55, 0.12);
      position: relative;
      overflow: hidden;
    }

    /* Efecto sutil de arco dorado inferior */
    .poster-frame::after {
      content: "";
      position: absolute;
      bottom: -45px;
      left: -10%;
      width: 120%;
      height: 80px;
      border-top: 3px solid var(--gold-main);
      border-radius: 50%;
      opacity: 0.45;
      pointer-events: none;
    }

    .poster-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-emblem {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
    }

    .poster-title {
      font-size: clamp(2.1rem, 5vw, 3.6rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .poster-title span {
      display: block;
    }

    .poster-slogan-ribbon {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 26px;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.25), transparent);
      border-top: 1px solid var(--gold-main);
      border-bottom: 1px solid var(--gold-main);
      color: var(--gold-light);
      font-weight: 800;
      font-size: clamp(0.85rem, 2vw, 1.15rem);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Cuadrícula de los 8 Servicios del Cartel */
    .poster-services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin: 28px 0;
    }

    .poster-service-card {
      background: linear-gradient(145deg, rgba(16, 33, 66, 0.9), rgba(7, 15, 32, 0.95));
      border: 1.5px solid var(--gold-main);
      border-radius: 14px;
      padding: 14px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    .poster-service-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-light);
      box-shadow: 0 10px 24px rgba(212, 175, 55, 0.22);
    }

    .service-icon-box {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, #fce38a 0%, #d4af37 100%);
      color: #050b18;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(212, 175, 55, 0.35);
    }

    .service-icon-box.wa-icon {
      background: linear-gradient(135deg, #34eb77 0%, #1da851 100%);
      color: #fff;
    }

    .service-card-text h3 {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .service-card-text p {
      font-size: 0.76rem;
      color: var(--gold-light);
      font-weight: 500;
      line-height: 1.25;
    }

    /* Barra de Valores con Estrellas (Atención Personalizada bien ajustada) */
    .poster-values-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px 28px;
      padding: 16px 20px;
      margin-top: 18px;
      background: rgba(5, 11, 24, 0.75);
      border-top: 1px solid rgba(212, 175, 55, 0.4);
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
    }

    .value-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .value-star {
      color: var(--gold-light);
      font-size: 1.1rem;
      text-shadow: 0 0 8px rgba(252, 227, 138, 0.6);
    }

    .poster-bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    .badge-active {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37, 211, 102, 0.14);
      border: 1px solid rgba(37, 211, 102, 0.5);
      color: #6ee7b7;
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      background: #25d366;
      border-radius: 50%;
      box-shadow: 0 0 8px #25d366;
    }

    .signature-script {
      font-family: 'Great Vibes', cursive;
      font-size: 2.1rem;
      color: var(--gold-light);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      margin-left: auto;
    }

    /* BLOQUE ATENCIÓN DIRECTA PERFECTAMENTE CENTRADO */
    .direct-attention-wrapper {
      margin: 28px auto 10px;
      max-width: 680px;
      text-align: center;
    }

    .direct-attention-card {
      background: linear-gradient(145deg, rgba(15, 31, 61, 0.95), rgba(7, 15, 32, 0.98));
      border: 2px solid var(--gold-main);
      border-radius: 18px;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.15);
    }

    .direct-label {
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .direct-phone {
      font-size: clamp(1.55rem, 4vw, 2.2rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      text-decoration: none;
      margin-bottom: 8px;
      display: inline-block;
    }

    .direct-sub {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .btn-wa-center {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #25d366 0%, #16a34a 100%);
      color: #ffffff;
      font-weight: 800;
