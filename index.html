<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bridge Home | Recargas a Cuba</title>
  <style>
    /* ===== ESTILOS GENERALES ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0a192f; color: #fff; min-height: 100vh;
    }
    
    /* ===== PANTALLA DE BIENVENIDA ===== */
    .pantalla-inicio {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px; text-align: center;
      background: linear-gradient(135deg, #0a192f 0%, #1e3a8a 100%);
    }
    .pantalla-inicio h1 { font-size: 2.8rem; margin-bottom: 10px; color: #fff; }
    .pantalla-inicio h2 { font-size: 1.5rem; color: #fbbf24; margin-bottom: 30px; font-style: italic; }
    .pantalla-inicio p { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 40px; max-width: 500px; }
    
    .btn-principal {
      background: #fbbf24; color: #0a192f; padding: 15px 40px;
      border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 1.2rem;
      border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(251, 191, 36, 0.3);
      transition: transform 0.2s;
    }
    .btn-principal:hover { transform: translateY(-3px); }

    /* ===== PANTALLA DE OFERTAS ===== */
    .pantalla-ofertas { display: none; padding: 20px; max-width: 650px; margin: 0 auto; padding-bottom: 100px; }
    
    .header-ofertas { text-align: center; margin-bottom: 25px; padding-top: 20px; }
    .header-ofertas h2 { font-size: 1.8rem; color: #fff; margin-bottom: 5px; }
    .header-ofertas p { color: #94a3b8; font-size: 0.9rem; }

    /* Tarjetas de oferta */
    .tarjeta {
      background: #112240; border: 1px solid #233554;
      border-radius: 16px; padding: 15px; margin-bottom: 15px;
      display: flex; align-items: center; gap: 15px;
      position: relative; overflow: hidden; transition: transform 0.2s;
    }
    .tarjeta:hover { transform: scale(1.02); border-color: #fbbf24; }

    /* Imagen de la oferta */
    .foto-oferta {
      width: 70px; height: 70px; border-radius: 12px; object-fit: cover;
      background: #233554; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; flex-shrink: 0; border: 1px solid #334155;
    }

    /* Etiquetas (VIP, Oferta, etc) */
    .etiqueta {
      position: absolute; top: 0; left: 0; padding: 4px 12px;
      font-size: 0.7rem; font-weight: 800; border-bottom-right-radius: 10px;
    }
    .tag-vendido { background: #fbbf24; color: #000; }
    .tag-especial { background: #eab308; color: #000; }
    .tag-oferta { background: #ef4444; color: #fff; }
    .tag-vip { background: #000; color: #fbbf24; border: 1px solid #fbbf24; }
    .tag-premium { background: #7c3aed; color: #fff; }

    /* Contenido de la tarjeta */
    .info-oferta { flex: 1; padding-top: 10px; }
    .info-oferta h3 { font-size: 1.2rem; color: #e2e8f0; font-weight: 800; margin-bottom: 5px; }
    .detalles { display: flex; flex-direction: column; gap: 3px; font-size: 0.85rem; color: #94a3b8; }

    /* Precio y botón */
    .accion-oferta { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; padding-top: 10px; }
    .precio { 
      background: #ef4444; color: white; font-weight: 900; font-size: 1.2rem;
      padding: 4px 12px; border-radius: 50px; border: 2px solid #7f1d1d; white-space: nowrap;
    }
    .btn-comprar {
      background: #25D366; color: white; border: none; padding: 8px 15px;
      border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      text-decoration: none; display: inline-block; transition: background 0.2s;
    }
    .btn-comprar:hover { background: #1da851; }

    /* Footer Flotante WhatsApp */
    .footer-wsp {
      position: fixed; bottom: 20px; left: 0; right: 0; text-align: center;
      padding: 0 20px; z-index: 100;
    }
    .btn-wsp-grande {
      background: #25D366; color: white; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; max-width: 400px; padding: 15px; border-radius: 50px;
      font-weight: 800; font-size: 1.1rem; box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
    }
    
    .oculto { display: none !important; }
    
    @media (max-width: 450px) {
      .tarjeta { flex-wrap: wrap; }
      .accion-oferta { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #233554; }
    }
  </style>
</head>
<body>

  <!-- ================= PANTALLA 1: BIENVENIDA ================= -->
  <div id="inicio" class="pantalla-inicio">
    <h1>YOUR BRIDGE HOME</h1>
    <h2>Conecta con los tuyos en Cuba ♥️</h2>
    <p>Recargas internacionales rápidas, seguras y al mejor precio. Activa el saldo de tus familiares en segundos.</p>
    <button onclick="mostrarOfertas()" class="btn-principal">Ver Ofertas de Recarga</button>
  </div>

  <!-- ================= PANTALLA 2: OFERTAS ================= -->
  <div id="ofertas" class="pantalla-ofertas oculto">
    <div class="header-ofertas">
      <h2>Ofertas Disponibles</h2>
      <p>Selecciona la que mejor se adapte a ti</p>
    </div>
    
    <!-- Aquí se generan las tarjetas automáticamente -->
    <div id="contenedor-tarjetas"></div>
  </div>

  <!-- Footer Flotante -->
  <div id="footer" class="footer-wsp oculto">
    <a href="#" id="btn-wsp-footer" target="_blank" class="btn-wsp-grande">
      💬 Recargar por WhatsApp
    </a>
  </div>

  <script>
    // =====================================================================
    // ⚙️ CONFIGURACIÓN: PON TU NÚMERO AQUÍ (Sin el símbolo +)
    // Ejemplo: 5355123456
    // =====================================================================
    const MI_WHATSAPP = "TU_NUMERO_AQUI"; 


    // =====================================================================
    // ⚙️ TUS OFERTAS: Modifica los textos, precios y fotos aquí abajo.
    // "imagen": "URL_DE_TU_FOTO" (Si lo dejas vacío "", saldrá un ícono).
    // =====================================================================
    const misOfertas = [
      { 
        nombre: "VOZ", 
        precio: "200", 
        etiqueta: "⭐ Más Vendido", 
        claseEtiqueta: "tag-vendido", 
        detalles: ["📞 80 MIN"], 
        imagen: "" // Pon aquí el enlace de tu foto
      },
      { 
        nombre: "SALDO", 
        precio: "250", 
        etiqueta: "✨ Especial", 
        claseEtiqueta: "tag-especial", 
        detalles: ["💳 350 CUP de SALDO", "📞 LIMITADO"], 
        imagen: "" 
      },
      { 
        nombre: "VOZ +", 
        precio: "270", 
        etiqueta: "🔥 Oferta", 
        claseEtiqueta: "tag-oferta", 
        detalles: ["📞 200 MIN"], 
        imagen: "" 
      },
      { 
        nombre: "COMBO", 
        precio: "300", 
        etiqueta: "👑 VIP", 
        claseEtiqueta: "tag-vip", 
        detalles: ["💳 120 SALDO", "📞 15 MIN + 20 SMS"], 
        imagen: "" 
      },
      { 
        nombre: "INTERNET +", 
        precio: "350", 
        etiqueta: "🌐 Internet", 
        claseEtiqueta: "tag-oferta", 
        detalles: ["🌐 2GB LTE + 300MB.cu"], 
        imagen: "" 
      },
      { 
        nombre: "COMBO +", 
        precio: "400", 
        etiqueta: "🔥 Oferta", 
        claseEtiqueta: "tag-oferta", 
        detalles: ["🌐 2GB + 300MB", "📞 15 MIN + 20 SMS"], 
        imagen: "" 
      },
      { 
        nombre: "COMBITO +", 
        precio: "550", 
        etiqueta: "✨ Especial", 
        claseEtiqueta: "tag-especial", 
        detalles: ["💳 240 SALDO", "📞 15 MIN + 20 SMS"], 
        imagen: "" 
      },
      { 
        nombre: "INTERNET 1", 
        precio: "650", 
        etiqueta: "✨ Especial", 
        claseEtiqueta: "tag-especial", 
        detalles: ["🌐 3GB + 300MB.cu"], 
        imagen: "" 
      },
      { 
        nombre: "COMBO 1", 
        precio: "750", 
        etiqueta: "⭐ Más Vendido", 
        claseEtiqueta: "tag-vendido", 
        detalles: ["🌐 3GB + 300MB.cu", "📞 25 MIN + 20 SMS"], 
        imagen: "" 
      },
      { 
        nombre: "COMBITO MEJOR", 
        precio: "750", 
        etiqueta: "👑 Premium", 
        claseEtiqueta: "tag-premium", 
        detalles: ["💳 360 SALDO", "📞 15 MIN + 20 SMS"], 
        imagen: "" 
      },
      { 
        nombre: "INTERNET 2 🤓", 
        precio: "1250", 
        etiqueta: "👑 Premium", 
        claseEtiqueta: "tag-premium", 
        detalles: ["🌐 7GB + 300MB"], 
        imagen: "" 
      },
      { 
        nombre: "COMBO 2 😍", 
        precio: "1300", 
        etiqueta: "✨ Especial", 
        claseEtiqueta: "tag-especial", 
        detalles: ["🌐 7GB + 300MB", "📞 40 MIN + 20 SMS"], 
        imagen: "" 
      },
      { 
        nombre: "INTERNET 3 🤯", 
        precio: "2500", 
        etiqueta: "⭐ Más Vendido", 
        claseEtiqueta: "tag-vendido", 
        detalles: ["🌐 15GB + 300MB"], 
        imagen: "" 
      },
      { 
        nombre: "COMBO 3 🎉", 
        precio: "2700", 
        etiqueta: "✨ Especial", 
        claseEtiqueta: "tag-especial", 
        detalles: ["🌐 15GB + 300MB", "📞 80 MIN + 20 SMS"], 
        imagen: "" 
      }
    ];
    // =====================================================================


    // 1. Función que dibuja las tarjetas en la página
    function cargarOfertas() {
      const contenedor = document.getElementById('contenedor-tarjetas');
      let html = '';

      misOfertas.forEach(oferta => {
        // Lógica de la foto: si hay enlace, usa <img>, si no, usa un <div> con emoji.
        let fotoHTML = oferta.imagen 
          ? `<img src="${oferta.imagen}" alt="${oferta.nombre}" class="foto-oferta">` 
          : `<div class="foto-oferta">📱</div>`;

        // Une los detalles en pequeños textos
        let detallesHTML = oferta.detalles.map(d => `<span>${d}</span>`).join('');

        // Crea la tarjeta HTML
        html += `
          <div class="tarjeta">
            ${oferta.etiqueta ? `<div class="etiqueta ${oferta.claseEtiqueta}">${oferta.etiqueta}</div>` : ''}
            
            ${fotoHTML}
            
            <div class="info-oferta">
              <h3>${oferta.nombre}</h3>
              <div class="detalles">${detallesHTML}</div>
            </div>
            
            <div class="accion-oferta">
              <div class="precio">${oferta.precio} P</div>
              <a href="#" class="btn-comprar" onclick="comprar('${oferta.nombre}', '${oferta.precio}')">Comprar</a>
            </div>
          </div>
        `;
      });

      contenedor.innerHTML = html;
    }

    // 2. Funciones de navegación
    const inicio = document.getElementById('inicio');
    const ofertas = document.getElementById('ofertas');
    const footer = document.getElementById('footer');

    function mostrarOfertas() {
      inicio.classList.add('oculto');
      ofertas.classList.remove('oculto');
      footer.classList.remove('oculto');
      window.scrollTo(0, 0);
    }

    // 3. Función del botón Comprar (Abre WhatsApp)
    function comprar(nombreOferta, precio) {
      const mensaje = `Hola, quiero comprar la oferta: *${nombreOferta}* por un valor de *${precio} P*. ¿Me ayudas a procesarla?`;
      const url = `https://wa.me/${MI_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
      window.open(url, '_blank');
    }

    // 4. Configurar el enlace del botón flotante de WhatsApp
    const btnWspFooter = document.getElementById('btn-wsp-footer');
    if (MI_WHATSAPP !== "TU_NUMERO_AQUI") {
        btnWspFooter.href = `https://wa.me/${MI_WHATSAPP}?text=Hola,%20quiero%20hacer%20una%20recarga%20a%20Cuba`;
    }

    // 5. Ejecutar al cargar la página
    cargarOfertas();
  </script>

</body>
</html>
