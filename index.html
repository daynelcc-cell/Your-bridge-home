<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🔥 ANTI-CACHÉ: Obliga a los navegadores de los clientes a descargar la versión nueva -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Mi Sitio Web - Datos en Vivo</title>
    
    <style>
        /* Estilos limpios y modernos en un solo lugar */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 2rem; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: #0f172a; font-size: 2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #64748b; }
        
        /* Estados de carga y error */
        #estado { text-align: center; padding: 2rem; font-size: 1.1rem; border-radius: 8px; margin-bottom: 1rem; }
        .cargando { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .exito { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: none; text-align: center; margin-bottom: 1rem;}
        
        /* Grid de tarjetas */
        .grid-datos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .tarjeta { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0; 
            transition: transform 0.2s;
        }
        .tarjeta:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .tarjeta h3 { color: #2563eb; margin-bottom: 0.75rem; font-size: 1.25rem; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; }
        .tarjeta p { color: #475569; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .tarjeta strong { color: #334155; }

        /* Botón de emergencia por si el caché es muy terco */
        .btn-forzar { display: block; margin: 2rem auto 0; padding: 0.75rem 1.5rem; background: #0f172a; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn-forzar:hover { background: #334155; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Panel de Datos</h1>
            <p class="subtitle">Conectado a Supabase en tiempo real</p>
        </header>

        <div id="estado" class="cargando">⏳ Conectando con la base de datos y cargando datos...</div>
        <div id="exito-msg" class="exito">✅ Datos actualizados correctamente.</div>
        
        <div id="contenedor-datos" class="grid-datos">
            <!-- Aquí se inyectarán las tarjetas automáticamente -->
        </div>

        <button class="btn-forzar" onclick="window.location.reload(true)">🔄 Forzar actualización de página</button>
    </div>

    <!-- 🔥 CONEXIÓN A SUPABASE (Versión 2 vía CDN, no requiere instalación) -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        // =====================================================================
        // ⚙️ CONFIGURACIÓN: SOLO TIENES QUE CAMBIAR ESTAS 2 LÍNEAS
        // =====================================================================
        
        const supabaseUrl = 'https://lwgeillycitljubenzhv.supabase.co';
        
        // 1. PEGA AQUÍ TU CLAVE "anon public" (La encuentras en Supabase > Settings > API)
        const supabaseKey = 'PEGA_AQUI_TU_CLAVE_ANON_PUBLICA'; 
        
        // 2. ESCRIBE AQUÍ EL NOMBRE EXACTO DE TU TABLA (ej: 'productos', 'clientes', 'posts')
        const nombreTabla = 'NOMBRE_DE_TU_TABLA'; 

        // =====================================================================

        const supabase = createClient(supabaseUrl, supabaseKey, {
            global: {
                headers: {
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache'
                }
            }
        });

        async function cargarDatos() {
            const estadoDiv = document.getElementById('estado');
            const contenedor = document.getElementById('contenedor-datos');
            const exitoMsg = document.getElementById('exito-msg');

            try {
                // Petición a la tabla, ordenada por lo más reciente primero (asumiendo que existe 'id' o 'created_at')
                const { data, error } = await supabase
                    .from(nombreTabla)
                    .select('*')
                    .order('id', { ascending: false }) // Si tu tabla no tiene 'id', cámbialo por 'created_at'

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    estadoDiv.className = 'error';
                    estadoDiv.innerHTML = '⚠️ La tabla existe, pero está vacía. Agrega datos en Supabase.';
                    return;
                }

                // ¡Éxito! Ocultamos carga y mostramos mensaje de éxito
                estadoDiv.style.display = 'none';
                exitoMsg.style.display = 'block';

                // Renderizar cada fila de la base de datos
                data.forEach(item => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta';
                    
                    // Lógica inteligente: Busca columnas comunes para el título, o usa la primera que encuentre
                    const titulo = item.nombre || item.titulo || item.producto || item.mensaje || 'Registro';
                    
                    // Generar el resto de los campos dinámicamente para garantizar que "algo aparezca"
                    let contenidoHTML = `<h3>${titulo}</h3>`;
                    for (const [key, value] of Object.entries(item)) {
                        // Omitimos id y created_at del cuerpo para que se vea más limpio (ya los usamos para ordenar)
                        if (key !== 'id' && key !== 'created_at' && key !== 'updated_at') {
                            // Si el valor es el mismo que el título, no lo repetimos
                            if (value !== titulo) {
                                contenidoHTML += `<p><strong>${key}:</strong> ${value}</p>`;
                            }
                        }
                    }
                    
                    tarjeta.innerHTML = contenidoHTML;
                    contenedor.appendChild(tarjeta);
                });

                console.log('✅ Datos cargados exitosamente:', data);

            } catch (err) {
                console.error('❌ Error de Supabase:', err);
                estadoDiv.className = 'error';
                estadoDiv.innerHTML = `
                    ❌ <strong>Error al conectar:</strong> ${err.message}<br><br>
                    <small>
                        <strong>Posibles causas:</strong><br>
                        1. La clave "anon public" está mal copiada.<br>
                        2. El nombre de la tabla ('${nombreTabla}') está mal escrito (revisa mayúsculas/minúsculas).<br>
                        3. Las políticas RLS (Row Level Security) en Supabase bloquean la lectura pública.
                    </small>
                `;
            }
        }

        // Ejecutar al cargar el documento
        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
