<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bridge Home | Viajes, Remesas y Recargas</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --border-color: #1f2937;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #3b82f6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Navegación */
    header {
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 15px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo-area h2 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
    }

    .logo-area span {
      font-size: 0.75rem;
      color: var(--primary);
      display: block;
    }

    nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a, nav button {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    nav a:hover, nav button:hover {
      color: var(--primary);
    }

    /* Contenedor General */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Hero Section */
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: center;
      margin-bottom: 50px;
    }

    @media (max-width: 850px) {
      .hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 15px;
    }

    .hero p {
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 1rem;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 850px) {
      .hero-buttons {
        justify-content: center;
      }
    }

    .btn {
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      border: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #374151;
      color: var(--text-main);
    }

    .btn-outline:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Imagen Principal Hero */
    .hero-image-box {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      display: none; /* Se muestra automáticamente si hay URL de foto */
    }

    .hero-image-box img {
      width: 100%;
      height: auto;
      max-height: 360px;
      object-fit: cover;
      display: block;
    }

    /* Calculadora de Divisas */
    .calc-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .calc-card h3 {
      margin-bottom: 15px;
      font-size: 1.2rem;
      text-align: center;
    }

    .calc-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #090d16;
      border: 1px solid #374151;
      border-radius: 8px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .calc-result {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin-top: 10px;
    }

    .calc-result strong {
      font-size: 1.5rem;
      color: var(--primary);
      display: block;
    }

    /* Info Bar & Contacto Directo */
    .info-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .status-dot {
      height: 10px;
      width: 10px;
      background-color: var(--primary);
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }

    /* Secciones Generales */
    .section-header {
      text-align: center;
      max-width: 650px;
      margin: 0 auto 35px auto;
    }

    .section-header span {
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-header h2 {
      font-size: 2rem;
      margin: 8px 0;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Grid de Tasas */
    .rates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 50px;
    }

    .rate-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .rate-box small {
      color: var(--text-muted);
      font-weight: 600;
      display: block;
      margin-bottom: 5px;
    }

    .rate-box .price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* =========================================================
       CORRECCIÓN DE CENTRADO Y AJUSTE EN TARJETAS DE SERVICIOS
       ========================================================= */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .service-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center; /* Todo el texto perfectamente centrado */
      overflow: hidden;
      word-wrap: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      transition: transform 0.2s, border-color 0.2s;
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .service-card h3 {
      font-size: 1.15rem;
      margin-bottom: 10px;
      color: var(--text-main);
      width: 100%;
      line-height: 1.3;
    }

    .service-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      width: 100%;
      line-height: 1.5;
    }

    /* Oferta Destacada */
    .promo-banner {
      background: linear-gradient(135deg, #111827 0%, #064e3b 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      padding: 35px 25px;
      text-align: center;
      margin-bottom: 50px;
    }

    .promo-banner h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .promo-banner p {
      color: #d1fae5;
      max-width: 600px;
      margin: 0 auto 20px auto;
    }

    /* Planes de Recarga */
    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .plan-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 22px;
      text-align: center;
      position: relative;
    }

    .plan-tag {
      background: var(--primary);
      color: #000;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .plan-price {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 10px 0;
      color: var(--text-main);
    }

    /* Panel Admin */
    #admin-panel {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--primary);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 50px;
    }

    .admin-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th, td {
