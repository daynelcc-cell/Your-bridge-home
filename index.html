async function loadWeather() {

      "?latitude=55.75" +
      "&longitude=37.61" +

/* =====================================================
   SUPABASE
===================================================== */

async function initSupabase() {

  try {

    if (!window.supabase) {

      setConnectionMessage(
        "⚠️ No se cargó Supabase. Usando datos locales."
      );

      renderAll();

      return;
    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    await loadData();

    /*
      Actualización en tiempo real.
      Si Realtime no está configurado en Supabase,
      simplemente continúa funcionando normalmente.
    */

    try {

      db.channel("ybh-admin-changes")

        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: TABLE
          },
          function(payload) {

            if (
              payload &&
              payload.new &&
              payload.new.id === "main"
            ) {

              data = {

                offers:
                  payload.new.offers || [],

                flights:
                  payload.new.flights || [],

                rates:
                  payload.new.rates || [],

                bannerTitle:
                  payload.new.bannerTitle ||
                  "YOUR BRIDGE HOME",

                bannerDescription:
                  payload.new.bannerDescription ||
                  "Tu puente hacia nuevas oportunidades.",

                notice:
                  payload.new.notice ||
                  "Bienvenido a YOUR BRIDGE HOME."
              };

              renderAll();

              if (isAdminAuthenticated) {
                renderAdmin();
              }

              setConnectionMessage(
                "✅ Actualización recibida en tiempo real.",
                true
              );
            }
          }
        )

        .subscribe();

    } catch (realtimeError) {

      console.warn(
        "Realtime no disponible:",
        realtimeError
      );
    }

  } catch (error) {

    console.error(
      "Error iniciando Supabase:",
      error
    );

    setConnectionMessage(
      "⚠️ Supabase no disponible. La página está usando datos locales."
    );

    renderAll();
  }
}


/* =====================================================
   MENSAJE DE CONEXIÓN
===================================================== */

function setConnectionMessage(message, success = false) {

  const element =
    document.getElementById("connectionNotice");

  if (!element) return;

  element.textContent = message;

  element.style.color =
    success
      ? "var(--green, #28d17c)"
      : "var(--red, #ff5b5b)";
}


/* =====================================================
   CARGAR DATOS
===================================================== */

async function loadData() {

  if (!db) {

    renderAll();

    return;
  }

  try {

    const result = await db
      .from(TABLE)
      .select("*")
      .eq("id", "main")
      .maybeSingle();

    if (result.error) {
      throw result.error;
    }

    const res = result.data;

    if (res) {

      data = {

        offers:
          Array.isArray(res.offers)
            ? res.offers
            : [],

        flights:
          Array.isArray(res.flights)
            ? res.flights
            : [],

        rates:
          Array.isArray(res.rates)
            ? res.rates
            : [],

        bannerTitle:
          res.bannerTitle ||
          "YOUR BRIDGE HOME",

        bannerDescription:
          res.bannerDescription ||
          "Tu puente hacia nuevas oportunidades.",

        notice:
          res.notice ||
          "Bienvenido a YOUR BRIDGE HOME."
      };

      setConnectionMessage(
        "✅ Conectado a la base de datos correctamente.",
        true
      );

      const storage =
        document.getElementById("storageStatus");

      if (storage) {
        storage.textContent = "Nube activa";
      }

    } else {

      /*
        Si todavía no existe el registro "main",
        intentamos crearlo.
      */

      await createInitialCloudData();
    }

  } catch (error) {

    console.error(
      "Error cargando Supabase:",
      error
    );

    setConnectionMessage(
      "⚠️ No se pudo cargar Supabase. Mostrando datos locales."
    );
  }

  renderAll();
}


/* =====================================================
   CREAR REGISTRO INICIAL
===================================================== */

async function createInitialCloudData() {

  if (!db) return;

  try {

    const result = await db
      .from(TABLE)
      .upsert({
        id: "main",

        offers: data.offers,

        flights: data.flights,

        rates: data.rates,

        bannerTitle: data.bannerTitle,

        bannerDescription:
          data.bannerDescription,

        notice: data.notice
      });

    if (result.error) {
      console.warn(
        "No se pudo crear el registro inicial:",
        result.error
      );
    }

  } catch (error) {

    console.warn(
      "No se pudo crear datos iniciales:",
      error
    );
  }
}


/* =====================================================
   GUARDAR EN SUPABASE
===================================================== */

async function saveToCloud() {

  if (!db) {

    toast(
      "Guardado solamente en esta sesión. Supabase no está conectado."
    );

    return;
  }

  try {

    const result = await db
      .from(TABLE)
      .upsert(
        {
          id: "main",

          offers: data.offers,

          flights: data.flights,

          rates: data.rates,

          bannerTitle:
            data.bannerTitle,

          bannerDescription:
            data.bannerDescription,

          notice:
            data.notice
        },
        {
          onConflict: "id"
        }
      );

    if (result.error) {
      throw result.error;
    }

    toast("✅ Guardado en la nube");

  } catch (error) {

    console.error(
      "Error guardando:",
      error
    );

    toast(
      "⚠️ No se pudo guardar en Supabase"
    );
  }
}

/* =====================================================
   FILTRO DE BOLETOS
===================================================== */

function filterTickets() {

  const searchInput =
    document.getElementById("ticketSearch");

  const list =
    document.getElementById("ticketList");

  if (!list) return;

  const query =
    searchInput
      ? searchInput.value.toLowerCase().trim()
      : "";

  const filtered =
    (data.flights || []).filter(function(f) {

      if (f.uzbek) return false;

      return (

        (f.origin || "")
          .toLowerCase()
          .includes(query)

        ||

        (f.destination || "")
          .toLowerCase()
          .includes(query)

        ||

        (f.airline || "")
          .toLowerCase()
          .includes(query)
      );
    });

  list.innerHTML =
    filtered.length
      ? filtered.map(ticketCard).join("")
      : '<div class="empty">No se encontraron boletos.</div>';
}

function toast(message) {

  element.style.display = "block";

/* =====================================================
   DINERO
===================================================== */

function money(value, currency) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {
    return "Consultar";
  }

  const number =
    Number(value);

  if (Number.isNaN(number)) {
    return "Consultar";
  }

  return (
    number.toLocaleString("es-ES") +
    " " +
    (currency || "")
  );
}


/* =====================================================
   SEGURIDAD HTML
===================================================== */

function safe(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, function(char) {

      const entities = {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      };

      return entities[char];
    });
}

}

      <div class="price">
        ${money(o.price, o.currency)}
      </div>

      <a
        class="btn green"
        target="_blank"
        href="${whatsappLink(
          "Hola, quiero información sobre: " +
          o.title
        )}"
      >
        Consultar
      </a>

    </article>
  `;
}


/* =====================================================
   TARJETA DE BOLETO
===================================================== */

function ticketCard(f) {

  return `
    <article class="card">

      <span class="pill">
        ${f.uzbek ? "UZBEKISTÁN" : "BOLETO"}
      </span>

      <h3>
        ✈️ ${safe(f.origin)}
        →
        ${safe(f.destination)}
      </h3>

      <p class="muted">

        Fecha:
        ${safe(f.date || "Consultar")}

        <br>

        Transporte:
        ${safe(f.airline || "Consultar")}

      </p>

      <div class="price">
        ${money(f.price, f.currency)}
      </div>

      <a
        class="btn green"
        target="_blank"
        href="${whatsappLink(
          "Hola, quiero consultar el boleto de " +
          (f.origin || "") +
          " a " +
          (f.destination || "")
        )}"
      >
        Consultar
      </a>

    </article>
  `;
}


/* =====================================================
   RENDERIZAR TODA LA PÁGINA
===================================================== */

function renderAll() {

  const offers =
    data.offers || [];

  const featured =
    offers.filter(function(o) {
      return o.featured;
    });

  const current =
    featured.length
      ? featured[
          bannerIndex % featured.length
        ]
      : null;


  /* BANNER */

  const banner =
    document.getElementById("mainBanner");

  if (banner) {

    banner.style.opacity = "0";

    setTimeout(function() {

      const title =
        document.getElementById("bannerTitle");

      const description =
        document.getElementById(
          "bannerDescription"
        );

      const price =
        document.getElementById(
          "bannerPrice"
        );

      if (title) {

        title.textContent =
          current
            ? current.title
            : data.bannerTitle;
      }

      if (description) {

        description.textContent =
          current
            ? current.description
            : data.bannerDescription;
      }

      if (price) {

        price.textContent =
          current
            ? money(
                current.price,
                current.currency
              )
            : "";
      }

      banner.style.opacity = "1";

    }, 200);
  }


  /* INFORMACIÓN */

  const notice =
    document.getElementById(
      "noticeText"
    );

  if (notice) {

    notice.textContent =
      data.notice || "";
  }


  /* OFERTAS */

  const homeOffers =
    document.getElementById(
      "homeOffers"
    );

  if (homeOffers) {

    homeOffers.innerHTML =
      offers.length
        ? offers
            .map(offerCard)
            .join("")
        : '<div class="empty">Sin ofertas.</div>';
  }


  /* SERVICIOS */

  const serviceList =
    document.getElementById(
      "serviceList"
    );

  if (serviceList) {

    const services =
      offers.filter(function(o) {

        return (
          o.type === "recarga" ||
          o.type === "remesa" ||
          o.type === "servicio"
        );
      });

    serviceList.innerHTML =
      services.length
        ? services
            .map(offerCard)
            .join("")
        : '<div class="empty">Sin servicios.</div>';
  }


  /* BOLETOS */

  filterTickets();


  /* BOLETOS UZBEKISTÁN */

  const uzbekList =
    document.getElementById(
      "uzbekList"
    );

  if (uzbekList) {

    const uzbek =
      (data.flights || [])
        .filter(function(f) {
          return f.uzbek;
        });

    uzbekList.innerHTML =
      uzbek.length
        ? uzbek
            .map(ticketCard)
            .join("")
        : '<div class="empty">Sin boletos de Uzbekistán.</div>';
  }


  /* TASAS */

  const rateList =
    document.getElementById(
      "rateList"
    );

  if (rateList) {

    rateList.innerHTML =
      (data.rates || [])
        .map(function(r) {

          return `
            <div class="card">

              <h3>
                ${safe(r.name)}
              </h3>

              <div class="price">
                ${safe(r.value)}
              </div>

            </div>
          `;
        })
        .join("");
  }


  /* CALCULADORA */

  const select =
    document.getElementById(
      "calcRate"
    );

  if (select) {

    select.innerHTML =
      (data.rates || [])
        .filter(function(r) {
          return Number(r.value) > 0;
        })
        .map(function(r) {

          return `
            <option value="${safe(r.id)}">
              ${safe(r.name)}
            </option>
          `;
        })
        .join("");
  }

  calculate();
}

   LIMPIAR FORMULARIO DE OFERTA

function clearOfferForm() {

  [
    "editId",
    "offerTitle",
    "offerDescription",
    "offerPrice",
    "offerTag"
  ].forEach(function(id) {

    const element =
      document.getElementById(id);

    if (element) {
      element.value = "";
    }
  });


  const currency =
    document.getElementById(
      "offerCurrency"
    );

  if (currency) {
    currency.value = "₽";
  }


  const featured =
    document.getElementById(
      "offerFeatured"
    );

  if (featured) {
    featured.checked = false;
  }
}


/* =====================================================
   GUARDAR OFERTA
===================================================== */

function saveOffer() {

  const titleElement =
    document.getElementById(
      "offerTitle"
    );

  if (!titleElement) return;

  const title =
    titleElement.value.trim();

  if (!title) {

    toast("Falta el nombre");

    return;
  }


  const editId =
    document.getElementById(
      "editId"
    );


  const id =
    editId &&
    editId.value
      ? editId.value
      : "o" + Date.now();


  const description =
    document.getElementById(
      "offerDescription"
    );


  const price =
    document.getElementById(
      "offerPrice"
    );


  const currency =
    document.getElementById(
      "offerCurrency"
    );


  const type =
    document.getElementById(
      "offerType"
    );


  const tag =
    document.getElementById(
      "offerTag"
    );


  const featured =
    document.getElementById(
      "offerFeatured"
    );


  const item = {

    id: id,

    title: title,

    description:
      description
        ? description.value
        : "",

    price:
      price
        ? Number(price.value || 0)
        : 0,

    currency:
      currency
        ? currency.value || "₽"
        : "₽",

    type:
      type
        ? type.value
        : "servicio",

    tag:
      tag
        ? tag.value
        : "",

    featured:
      featured
        ? featured.checked
        : false
  };


  const index =
    data.offers.findIndex(
      function(o) {
        return o.id === id;
      }
    );


  if (index >= 0) {

    data.offers[index] =
      item;

  } else {

    data.offers.push(item);
  }


  renderAll();

  renderAdmin();

  saveToCloud();

  clearOfferForm();

  toast("✅ Oferta guardada");
}


/* =====================================================
   EDITAR OFERTA
===================================================== */

function editOffer(id) {

  const offer =
    data.offers.find(
      function(o) {
        return o.id === id;
      }
    );

  if (!offer) return;


  const editId =
    document.getElementById(
      "editId"
    );

  const title =
    document.getElementById(
      "offerTitle"
    );

  const description =
    document.getElementById(
      "offerDescription"
    );

  const price =
    document.getElementById(
      "offerPrice"
    );

  const currency =
    document.getElementById(
      "offerCurrency"
    );

  const type =
    document.getElementById(
      "offerType"
    );

  const tag =
    document.getElementById(
      "offerTag"
    );

  const featured =
    document.getElementById(
      "offerFeatured"
    );


  if (editId) editId.value = offer.id;

  if (title) title.value = offer.title;

  if (description)
    description.value =
      offer.description || "";

  if (price)
    price.value =
      offer.price || "";

  if (currency)
    currency.value =
      offer.currency || "₽";

  if (type)
    type.value =
      offer.type || "servicio";

  if (tag)
    tag.value =
      offer.tag || "";

  if (featured)
    featured.checked =
      !!offer.featured;
}


/* =====================================================
   ELIMINAR OFERTA
===================================================== */

function deleteOffer(id) {

  if (!confirm("¿Eliminar esta oferta?")) {
    return;
  }

  data.offers =
    data.offers.filter(
      function(o) {
        return o.id !== id;
      }
    );

  renderAll();

  renderAdmin();

  saveToCloud();

  toast("Oferta eliminada");
}


/* =====================================================
   GUARDAR BOLETO
===================================================== */

function saveFlight() {

  const originElement =
    document.getElementById(
      "flightOrigin"
    );

  const destinationElement =
    document.getElementById(
      "flightDestination"
    );

  const priceElement =
    document.getElementById(
      "flightPrice"
    );


  if (
    !originElement ||
    !destinationElement ||
    !priceElement
  ) {
    return;
  }


  const origin =
    originElement.value.trim();

  const destination =
    destinationElement.value.trim();

  const price =
    priceElement.value;


  if (
    !origin ||
    !destination ||
    !price
  ) {

    toast(
      "Faltan datos del boleto"
    );

    return;
  }


  const dateElement =
    document.getElementById(
      "flightDate"
    );

  const airlineElement =
    document.getElementById(
      "flightAirline"
    );

  const currencyElement =
    document.getElementById(
      "flightCurrency"
    );

  const uzbekElement =
    document.getElementById(
      "flightUzbek"
    );


  data.flights.push({

    id:
      "f" + Date.now(),

    origin:
      origin,

    destination:
      destination,

    date:
      dateElement
        ? dateElement.value
        : "",

    airline:
      airlineElement
        ? airlineElement.value
        : "",

    price:
      Number(price),

    currency:
      currencyElement
        ? currencyElement.value || "₽"
        : "₽",

    uzbek:
      uzbekElement
        ? uzbekElement.checked
        : false
  });


  renderAll();

  renderAdmin();

  saveToCloud();


  [
    "flightOrigin",
    "flightDestination",
    "flightDate",
    "flightAirline",
    "flightPrice"
  ].forEach(function(id) {

    const element =
      document.getElementById(id);

    if (element) {
      element.value = "";
    }
  });


  toast("✅ Boleto añadido");
}

/* =====================================================
   CALCULADORA
===================================================== */

function calculate() {

  const rateSelect =
    document.getElementById(
      "calcRate"
    );

  const amountInput =
    document.getElementById(
      "calcAmount"
    );

  const resultElement =
    document.getElementById(
      "calcResult"
    );


  if (
    !rateSelect ||
    !amountInput ||
    !resultElement
  ) {
    return;
  }


  const id =
    rateSelect.value;

  const amount =
    Number(
      amountInput.value || 0
    );


  const rate =
    data.rates.find(
      function(r) {
        return r.id === id;
      }
    );


  if (!rate) {

    resultElement.textContent =
      "0";

    return;
  }


  const result =
    amount *
    Number(rate.value);


  resultElement.textContent =
    result.toLocaleString(
      "es-ES"
    ) +
    " " +
    rate.to;
}


/* =====================================================
   GENERADOR DE TARJETAS
===================================================== */

function generateCard() {

  const canvas =
    document.getElementById(
      "promoCanvas"
    );

  if (!canvas) return;


  const ctx =
    canvas.getContext("2d");


  const colorElement =
    document.getElementById(
      "cardColor"
    );


  const color =
    colorElement
      ? colorElement.value
      : "#071629";


  ctx.fillStyle = color;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  ctx.strokeStyle =
    "#e9bd65";

  ctx.lineWidth = 8;

  ctx.strokeRect(
    20,
    20,
    canvas.width - 40,
    canvas.height - 40
  );


  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "#e9bd65";

  ctx.font =
    "bold 32px Arial";

  ctx.fillText(
    "YOUR BRIDGE HOME",
    canvas.width / 2,
    105
  );


  const tagElement =
    document.getElementById(
      "cardTag"
    );


  ctx.fillStyle =
    "#54d8e8";

  ctx.font =
    "bold 22px Arial";

  ctx.fillText(
    (
      tagElement
        ? tagElement.value
        : "OFERTA"
    ).toUpperCase(),
    canvas.width / 2,
    190
  );


  const titleElement =
    document.getElementById(
      "cardTitle"
    );


  ctx.fillStyle =
    "#ffffff";

  ctx.font =
    "bold 43px Arial";

  ctx.fillText(
    titleElement &&
    titleElement.value
      ? titleElement.value
      : "Tu oferta",
    canvas.width / 2,
    270
  );


  const descriptionElement =
    document.getElementById(
      "cardDescription"
    );


  ctx.fillStyle =
    "#dce6f0";

  ctx.font =
    "25px Arial";

  ctx.fillText(
    descriptionElement
      ? descriptionElement.value
      : "",
    canvas.width / 2,
    370
  );


  const priceElement =
    document.getElementById(
      "cardPrice"
    );


  ctx.fillStyle =
    "#e9bd65";

  ctx.font =
    "bold 48px Arial";

  ctx.fillText(
    priceElement &&
    priceElement.value
      ? priceElement.value
      : "CONSULTAR",
    canvas.width / 2,
    500
  );
}


/* =====================================================
   DESCARGAR TARJETA
===================================================== */

function downloadCard() {

  const canvas =
    document.getElementById(
      "promoCanvas"
    );

  if (!canvas) return;

  generateCard();

  const link =
    document.createElement("a");

  link.href =
    canvas.toDataURL(
      "image/png"
    );

  link.download =
    "YOUR-BRIDGE-HOME.png";

  link.click();
}


/* =====================================================
   IDIOMAS
===================================================== */

function setLanguage(lang) {

  const labels = {

    es: [
      "Inicio",
      "Servicios",
      "Boletos",
      "Tasas",
      "Explora",
      "Calculadora",
      "Tarjetas",
      "Contacto",
      "⚙ Administrar"
    ],

    en: [
      "Home",
      "Services",
      "Tickets",
      "Rates",
      "Explore",
      "Calculator",
      "Cards",
      "Contact",
      "⚙ Admin"
    ],

    ru: [
      "Главная",
      "Услуги",
      "Билеты",
      "Курсы",
      "Обзор",
      "Калькулятор",
      "Карточки",
      "Контакты",
      "⚙ Управление"
    ]
  };


  if (!labels[lang]) {
    return;
  }


  document
    .querySelectorAll(
      "#navigation button"
    )
    .forEach(function(button, index) {

      if (labels[lang][index]) {

        button.textContent =
          labels[lang][index];
      }
    });
}


/* =====================================================
   CAMBIO AUTOMÁTICO DEL BANNER
   CADA 20 SEGUNDOS
===================================================== */

setInterval(function() {

  const featured =
    data.offers.filter(
      function(o) {
        return o.featured;
      }
    );


  if (featured.length > 1) {

    bannerIndex =
      (
        bannerIndex + 1
      ) %
      featured.length;

    renderAll();
  }

}, 20000);
